app = 'campscout-api'
primary_region = 'sjc'

[build]

[env]
  ENVIRONMENT = 'prod'
  SCANNER_ENABLED = 'true'
  SCAN_USER_AGENT = 'CampScout/0.1 (campscout.dev)'
  NOTIFY_FROM_EMAIL = 'onboarding@resend.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  path = '/health'
  timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
