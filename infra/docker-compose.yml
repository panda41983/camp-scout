services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: campscout
      POSTGRES_PASSWORD: campscout
      POSTGRES_DB: campscout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campscout"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
